version: "3.8"

services:
  zerokernel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: zerokernel-daemon
    privileged: true
    network_mode: host
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ./receipts:/var/log/zerokernel/receipts
    ports:
      - "9100:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zerokernel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: zerokernel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

