[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerokernel"
version = "0.1.0"
description = "Python SDK for ZeroKernel Ring-0 eBPF & zkVM Cryptographic Audit Engine"
readme = "README.md"
authors = [{ name = "Scott R. M. Hardie", email = "scott@settler.dev" }]
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
